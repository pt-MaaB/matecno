# matecno.pt — 301s from retired URLs to the current pages (2026-10-27).
# Installed by deploy.sh as /etc/nginx/snippets/matecno-redirects.conf, included in the matecno.pt server block.
#
# Three retired generations still circulate: Google showed them 400+ times since 2025-06, Googlebot keeps asking for
# them, and Brave Search's ONLY matecno.pt page on 2026-10-27 was /servicos/emails-profissionais (the IT-support offer).
#   1. the first static site (2026-01): about.html, contact.html, faq.html
#   2. the IT-support Astro site (before 7d2a51d): services, faq, blog
#   3. guessed or mixed-language URLs seen in the access log
# Each goes to the closest current page; an offer MaTecno no longer sells goes to the services hub.

# 1. first static site
location = /about.html   { return 301 https://matecno.pt/sobre/; }
location = /contact.html { return 301 https://matecno.pt/contacto/; }
location = /faq.html     { return 301 https://matecno.pt/; }

# 2. IT-support site: services
location ~ ^/servicos/(design-websites|alojamento-web|seo)/?$ { return 301 https://matecno.pt/servicos/websites/; }
location ~ ^/servicos/(emails-profissionais|redes|servidores|ciberseguranca)/?$ { return 301 https://matecno.pt/servicos/; }

# 2. IT-support site: faq and blog (IT-support articles; no current equivalent)
location ~ ^/faq/?$ { return 301 https://matecno.pt/; }
location ~ ^/blog/?$ { return 301 https://matecno.pt/; }
location ~ ^/blog/.+ { return 301 https://matecno.pt/servicos/; }

# 3. mixed-language guess
location ~ ^/en/servicos/automacao/?$ { return 301 https://matecno.pt/en/services/process-automation/; }
